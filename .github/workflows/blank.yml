
name: Gerar APK V16.2.8

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar e extrair ZIP V16.2.8
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/WA_Autoatendimento_V16_2_8_CORRECOES_SONS.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Nao encontrei o ZIP V16.2.8 na raiz do repositorio."
            echo "Arquivos encontrados:"
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f
            exit 1
          fi

          unzip -t "$ZIP"
          BUILD_DIR="$RUNNER_TEMP/wa-v16-2-8"
          mkdir -p "$BUILD_DIR"
          unzip -q "$ZIP" -d "$BUILD_DIR"

          SETTINGS="$(find "$BUILD_DIR" -type f -name settings.gradle -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::O ZIP nao contem settings.gradle."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          for FILE in \
            build.gradle \
            app/build.gradle \
            app/src/main/AndroidManifest.xml \
            app/src/main/assets/index.html \
            app/src/main/java/com/autoatendimento/app/MainActivity.java \
            app/src/main/java/com/autoatendimento/app/WhatsAppNotificationService.java
          do
            if [ ! -f "$PROJECT_DIR/$FILE" ]; then
              echo "::error::Arquivo obrigatorio ausente: $FILE"
              exit 1
            fi
          done

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto V16.2.8 localizado e validado."

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --console=plain \
            :app:assembleDebug \
            2>&1 | tee "$RUNNER_TEMP/compilacao.log"

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WA-Autoatendimento-V16.2.8-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Disponibilizar log em caso de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-compilacao-V16.2.8
          path: ${{ runner.temp }}/compilacao.log
          if-no-files-found: warn
          retention-days: 7
