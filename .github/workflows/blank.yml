name: Gerar APK WA Autoatendimento V16.3.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validar e extrair projeto V16.3.2
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/WA_Autoatendimento_V16_3_2_RESPOSTAS_BIOMETRIA.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::Coloque WA_Autoatendimento_V16_3_2_RESPOSTAS_BIOMETRIA.zip na raiz do repositorio."
            exit 1
          fi
          unzip -t "$ZIP"
          BUILD_DIR="$RUNNER_TEMP/wa-autoatendimento-v1632"
          mkdir -p "$BUILD_DIR"
          unzip -q "$ZIP" -d "$BUILD_DIR"
          for FILE in settings.gradle build.gradle app/build.gradle app/src/main/AndroidManifest.xml app/src/main/assets/index.html app/src/main/java/com/autoatendimento/app/MainActivity.java app/src/main/java/com/autoatendimento/app/WhatsAppNotificationService.java; do
            test -f "$BUILD_DIR/$FILE" || { echo "::error::Arquivo ausente: $FILE"; exit 1; }
          done
          echo "PROJECT_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "Projeto V16.3.2 validado."
      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --console=plain :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/compilacao.log"
      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WA-Autoatendimento-V16.3.2-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Guardar log em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-compilacao-WA-V16.3.2
          path: ${{ runner.temp }}/compilacao.log
          if-no-files-found: warn
          retention-days: 7
